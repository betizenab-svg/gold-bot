name: Monthly report

# On the 1st of each month: last month's results as a PDF and images (from the
# public ledger), saved for the website and posted to the public channel.

on:
  schedule:
    - cron: "0 6 1 * *" # 09:00 in Ethiopia
  workflow_dispatch:
    inputs:
      month:
        description: "Month as YYYY-MM (empty = last month)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build and post the report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then
            python scripts/monthly_report.py --month "$MONTH" --post
          else
            python scripts/monthly_report.py --post
          fi
      - name: Save it for the website
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add site/reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "report: monthly results [skip ci]"
          git push || (git pull --rebase && git push)
