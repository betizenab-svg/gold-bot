name: Replay Validation

# Weekly self-audit (and on-demand): replays the full live pipeline over
# recent history for EVERY market and publishes the performance reports
# as downloadable artifacts.

on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 02:00 UTC, while markets are closed
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to replay (max 59)"
        required: false
        default: "45"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAUUSD, BTCUSD, EURUSD, GBPUSD]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run replay
        run: >
          python scripts/replay.py
          --days "${{ github.event.inputs.days || '45' }}"
          --symbol "${{ matrix.symbol }}"
          --out "replay_${{ matrix.symbol }}.json"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: replay-report-${{ matrix.symbol }}
          path: replay_${{ matrix.symbol }}.json
