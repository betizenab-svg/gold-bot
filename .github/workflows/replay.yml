name: Replay Validation

# On-demand: replays the full live pipeline over recent history and
# publishes the performance report as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of 5m history to replay (max 59)"
        required: false
        default: "45"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run replay
        run: python scripts/replay.py --days "${{ github.event.inputs.days }}" --out replay_report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: replay-report
          path: replay_report.json
