name: Gold Bot Pulse

# Runs one pulse of the signal engine. An outside timer (cron-job.org) starts
# it every 5 minutes through workflow_dispatch; GitHub's own schedule below
# skips most runs and is only a backup.
#
# The bot's database travels between runs in the Actions cache (a new entry per
# run; older entries are deleted, the newest 20 are kept). A copy is committed
# to the repository at most every 6 hours, so the git history stays small.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

# Never allow two pulses to run at the same time (replaces the cPanel file lock).
concurrency:
  group: gold-bot-pulse
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the latest code
        uses: actions/checkout@v7
        with:
          # A run that waited in the queue must not start from older code/state.
          ref: ${{ github.ref }}

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Library versions are pinned, so the ready-made environment is reused
      # until requirements.txt changes (the weekly update job moves the pins).
      - name: Restore installed packages
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          if ! .venv/bin/python -c "import dotenv, requests, pandas, yfinance, matplotlib" 2>/dev/null; then
            rm -rf .venv
            python -m venv .venv
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Restore the bot's latest state
        id: state
        uses: actions/cache/restore@v6
        with:
          path: data/trading_engine.db
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Check the restored state
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESTORED_KEY: ${{ steps.state.outputs.cache-matched-key }}
        run: |
          if [ -n "$RESTORED_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(gh cache list --key bot-state- --limit 1 --json key --jq length)" = "0" ]; then
            echo "No saved state yet: starting from the copy in the repository."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Running on the older repository copy would repeat alerts already sent.
            echo "::warning::The saved bot state could not be restored; skipping this pulse."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # The step limit leaves time for the state to be saved even if a pulse hangs.
      - name: Run one pulse
        id: pulse
        if: steps.guard.outputs.run == 'true'
        timeout-minutes: 6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          BOT_PAUSED: ${{ vars.BOT_PAUSED }}
          CB_NET_PURCHASES_TONNES: ${{ vars.CB_NET_PURCHASES_TONNES }}
          CB_NET_PURCHASES_QUARTER: ${{ vars.CB_NET_PURCHASES_QUARTER }}
          # Optional: limit the markets (default: every market with an on-time free feed),
          # promote trial markets (e.g. US100) and trial strategies (NONE = all public).
          SYMBOLS: ${{ vars.SYMBOLS }}
          PROMOTED_SYMBOLS: ${{ vars.PROMOTED_SYMBOLS }}
          TRIAL_STRATEGIES: ${{ vars.TRIAL_STRATEGIES }}
          SIGNAL_TIMEFRAME: "M5"
          BOT_LOG_LEVEL: "INFO"
        run: .venv/bin/python src/bot_runner.py

      # Saved even if the pulse failed part-way: alerts it already sent are in it.
      - name: Save the bot's state
        if: always() && steps.pulse.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: data/trading_engine.db
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete old copies of the saved state (keep the newest 20)
        if: always() && steps.pulse.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key bot-state- --sort created_at --order desc --limit 100 \
            --json id --jq '.[20:][].id' | while read -r cache_id; do
            gh cache delete "$cache_id" >/dev/null || true
          done

      - name: Copy the state into the repository (at most every 6 hours)
        if: always() && steps.pulse.outcome != 'skipped'
        run: |
          git show HEAD:data/trading_engine.db > "$RUNNER_TEMP/repo_copy.db"
          age=$(.venv/bin/python - "$RUNNER_TEMP/repo_copy.db" <<'PY'
          import sqlite3, sys, time
          row = sqlite3.connect(sys.argv[1]).execute(
              "SELECT value FROM kv_store WHERE key = 'last_pulse_wallclock'"
          ).fetchone()
          print(int(time.time()) - int(row[0]) if row else 10**9)
          PY
          )
          if [ "$age" -lt 21600 ]; then
            echo "Repository copy is recent enough."
            exit 0
          fi
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data/trading_engine.db
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "pulse: state snapshot [skip ci]"
          # Retry push once after rebasing, in case a manual commit landed meanwhile.
          git push || (git pull --rebase && git push)

      - name: Tell the outside watchdog how this run went
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
          OUTCOME: ${{ steps.pulse.outcome }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          if [ "$OUTCOME" = "success" ]; then suffix=""; else suffix="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "${HC_URL}${suffix}" \
            || echo "::warning::Could not reach the watchdog (healthchecks.io)."
