name: Website

# Publishes the public results site (site/) on GitHub Pages. The pages read the
# track record live from the repository, so new signals need no redeploy.
# One-time: repository Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/**"
      - "!site/reports/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
