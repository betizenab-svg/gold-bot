name: Tests

# Every code change is checked before it can reach the live bot. The bot's own
# state snapshots carry [skip ci] and are not tested.

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check code style and obvious mistakes
        run: ruff check .

      - name: Run the test suite
        run: python -m pytest -q -p no:cacheprovider

  # The Telegram command and membership bot (Cloudflare Worker).
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test the Worker
        working-directory: cloudflare
        run: node --test
