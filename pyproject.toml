[project]
name = "gold-trading-bot"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.setuptools]
# This makes the project root the import root so that
# `from src.core.orchestrator import ...` and
# `from config.settings import ...` both resolve correctly.
py-modules = []

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["."]
reportMissingImports = false
reportMissingModuleSource = false

[tool.pyre]
source_directories = ["."]
search_path = [".", "src", "config", ".venv/Lib/site-packages"]
exclude = ["*.egg-info", "__pycache__"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["books", "gold_trading_bot.egg-info"]

[tool.ruff.lint]
# Real mistakes only: syntax errors, undefined names, unused imports/variables.
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
